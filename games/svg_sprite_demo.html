<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SVGスプライト デモ - ペンギンの星集め</title>
<style>
  body { font-family: sans-serif; background: #1e1e1e; color: #f0f0f0; margin: 0; text-align: center; }
  header { padding: 16px 10px 4px; }
  h1 { margin: 0; font-size: 1.3em; color: #4db2ff; }
  .hud { display: flex; justify-content: center; gap: 24px; font-weight: bold; margin: 10px 0; font-size: 1.05em; }
  #stage { width: min(96vw, 640px); margin: auto; display: block; background: #79c26a; border: 3px solid #3e3e42; border-radius: 10px; touch-action: none; }
  button { background: #007acc; color: #fff; border: none; padding: 10px 26px; border-radius: 20px; font-weight: bold; font-size: 1em; cursor: pointer; }
  .pad { display: grid; grid-template-columns: repeat(3, 64px); gap: 6px; justify-content: center; margin: 14px auto 24px; user-select: none; -webkit-user-select: none; }
  .pad button { padding: 14px 0; font-size: 1.2em; background: #2d2d30; border: 1px solid #007acc; border-radius: 12px; }
  .note { color: #aaa; font-size: .85em; max-width: 640px; margin: 0 auto 26px; line-height: 1.7; padding: 0 12px; }
</style>
</head>
<body>
<header>
  <h1>🐧 SVGスプライト デモ - ペンギンの星集め</h1>
  <div class="hud"><span>⭐ スコア: <span id="score">0</span></span><span>⏱ 残り: <span id="time">60</span>秒</span></div>
  <button id="startBtn">▶ スタート</button>
</header>

<!-- 描画は全部このSVGの中。キャラも星も敵もSVGの部品（要素）です -->
<svg id="stage" viewBox="0 0 640 400">
  <defs>
    <pattern id="grass" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#79c26a"/>
      <rect width="20" height="20" fill="#72ba62"/>
      <rect x="20" y="20" width="20" height="20" fill="#72ba62"/>
    </pattern>
    <!-- 星スプライト（再利用する部品として定義） -->
    <g id="starShape">
      <polygon points="0,-14 4,-4 14,-4 6,3 9,13 0,7 -9,13 -6,3 -14,-4 -4,-4" fill="#ffd83d" stroke="#e0a800" stroke-width="2"/>
    </g>
    <!-- 木スプライト -->
    <g id="treeShape">
      <rect x="-4" y="0" width="8" height="14" fill="#7a4a21"/>
      <circle cx="0" cy="-8" r="14" fill="#2e7d32"/>
      <circle cx="-10" cy="0" r="10" fill="#359846"/>
      <circle cx="10" cy="0" r="10" fill="#359846"/>
    </g>
  </defs>

  <rect width="640" height="400" fill="url(#grass)"/>
  <use href="#treeShape" x="60" y="70"/><use href="#treeShape" x="580" y="60"/>
  <use href="#treeShape" x="90" y="330"/><use href="#treeShape" x="560" y="330"/>
  <use href="#treeShape" x="320" y="46"/>

  <!-- 星（JSで位置を動かす） -->
  <g id="star"><use href="#starShape"/></g>

  <!-- 敵スライム：SVG部品の集まり。ぷよぷよ変形はJSでscaleを変える -->
  <g id="slime">
    <ellipse cx="0" cy="0" rx="20" ry="15" fill="#8e5bd6"/>
    <ellipse cx="0" cy="4" rx="14" ry="9" fill="#a678e8"/>
    <circle cx="-7" cy="-3" r="3" fill="#fff"/><circle cx="7" cy="-3" r="3" fill="#fff"/>
    <circle cx="-7" cy="-3" r="1.5" fill="#222"/><circle cx="7" cy="-3" r="1.5" fill="#222"/>
  </g>

  <!-- 主人公ペンギン：歩行アニメは足・腕・体を別部品にしてJSで位相をずらして動かす -->
  <g id="player">
    <g id="penguin">
      <ellipse cx="0" cy="0" rx="17" ry="20" fill="#263238"/>
      <ellipse cx="0" cy="5" rx="11" ry="14" fill="#fff"/>
      <circle cx="-6" cy="-8" r="2.6" fill="#fff"/><circle cx="6" cy="-8" r="2.6" fill="#fff"/>
      <circle cx="-6" cy="-8" r="1.3" fill="#111"/><circle cx="6" cy="-8" r="1.3" fill="#111"/>
      <polygon points="-4,-3 4,-3 0,2" fill="#ff9800"/>
      <g id="armL"><ellipse cx="-19" cy="2" rx="5" ry="10" fill="#263238"/></g>
      <g id="armR"><ellipse cx="19" cy="2" rx="5" ry="10" fill="#263238"/></g>
      <g id="footL"><ellipse cx="-8" cy="21" rx="7" ry="3.5" fill="#ff9800"/></g>
      <g id="footR"><ellipse cx="8" cy="21" rx="7" ry="3.5" fill="#ff9800"/></g>
    </g>
  </g>

  <text id="msg" x="320" y="200" text-anchor="middle" font-size="26" font-weight="bold" fill="#fff" style="display:none; paint-order:stroke; stroke:#000; stroke-width:5"></text>
</svg>

<!-- スマホ用十字キー -->
<div class="pad">
  <span></span><button data-dir="up">▲</button><span></span>
  <button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button>
</div>

<p class="note">
  遊び方：矢印キー／WASD／画面の十字キーでペンギンを動かし、60秒で星を何個集められるか。スライムに当たるとスコア-1＆スタート位置に戻ります。<br>
  仕組み：キャラはSVGの部品で、移動は transform、歩行は足の上下と体の傾きを位相でずらす方式、反転は scale(-1,1)、敵の変形も scale、当
たり判定は四角の重なり判定です。ソースを表示すれば全部読めます。
</p>

<script>
const W = 640, H = 400;
const playerEl = document.getElementById('player');
const penguinEl = document.getElementById('penguin');
const footL = document.getElementById('footL');
const footR = document.getElementById('footR');
const armL = document.getElementById('armL');
const armR = document.getElementById('armR');
const slimeEl = document.getElementById('slime');
const starEl = document.getElementById('star');
const msgEl = document.getElementById('msg');
const scoreEl = document.getElementById('score');
const timeEl = document.getElementById('time');

let px = 320, py = 200, face = 1;           // 主人公の座標と向き
let sx = 120, sy = 100;                      // スライムの座標
let star = { x: 480, y: 280 };
let score = 0, timeLeft = 60, running = false;
let phase = 0;                 // 歩行サイクルの位相
let liftL = 0, liftR = 0, tilt = 0, bobY = 0, swayX = 0;  // 現在の歩行ポーズ（補間用）
const keys = {};

// 入力：キーボード
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if (e.key.startsWith('Arrow')) e.preventDefault(); });
addEventListener('keyup',   e => { keys[e.key.toLowerCase()] = false; });
// 入力：十字キー（タッチ＆マウス）
document.querySelectorAll('.pad button').forEach(btn => {
  const dir = btn.dataset.dir;
  const on  = e => { e.preventDefault(); keys[dir] = true; };
  const off = e => { e.preventDefault(); keys[dir] = false; };
  btn.addEventListener('touchstart', on);  btn.addEventListener('touchend', off);
  btn.addEventListener('mousedown', on);   btn.addEventListener('mouseup', off); btn.addEventListener('mouseleave', off);
});

function placeStar() {
  star.x = 40 + Math.random() * (W - 80);
  star.y = 40 + Math.random() * (H - 80);
  starEl.setAttribute('transform', `translate(${star.x} ${star.y})`);
}
// 四角同士の当たり判定
function hit(ax, ay, bx, by, d) { return Math.abs(ax - bx) < d && Math.abs(ay - by) < d; }

function start() {
  score = 0; timeLeft = 60; px = 320; py = 200; sx = 120; sy = 100;
  scoreEl.textContent = score; timeEl.textContent = timeLeft;
  msgEl.style.display = 'none'; placeStar(); running = true;
}
document.getElementById('startBtn').addEventListener('click', start);

let last = performance.now(), secTimer = 0;
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  if (running) {
    // 移動
    let dx = 0, dy = 0;
    if (keys['arrowleft']  || keys['a'] || keys['left'])  dx -= 1;
    if (keys['arrowright'] || keys['d'] || keys['right']) dx += 1;
    if (keys['arrowup']    || keys['w'] || keys['up'])    dy -= 1;
    if (keys['arrowdown']  || keys['s'] || keys['down'])  dy += 1;
    const moving = (dx !== 0 || dy !== 0);
    if (moving) {
      const len = Math.hypot(dx, dy);
      px += dx / len * 170 * dt; py += dy / len * 170 * dt;
      px = Math.max(24, Math.min(W - 24, px)); py = Math.max(28, Math.min(H - 24, py));
      if (dx !== 0) face = dx > 0 ? 1 : -1;
      phase += dt * 11;   // 歩行サイクルを進める
    }
    // 歩行ポーズ：左右の足を交互に上げ、体を左右に揺らし、腕を逆位相で振る
    const tLiftL = moving ? Math.max(0, Math.sin(phase)) * 6 : 0;
    const tLiftR = moving ? Math.max(0, Math.sin(phase + Math.PI)) * 6 : 0;
    const tTilt  = moving ? Math.sin(phase) * 4 : 0;
    const tBob   = moving ? -Math.abs(Math.sin(phase)) * 3 : 0;
    const tSway  = moving ? Math.sin(phase) * 2.5 : 0;
    const k = Math.min(1, dt * 18);   // ポーズへ滑らかに寄せる
    liftL += (tLiftL - liftL) * k; liftR += (tLiftR - liftR) * k;
    tilt += (tTilt - tilt) * k; bobY += (tBob - bobY) * k; swayX += (tSway - swayX) * k;
    footL.setAttribute('transform', `translate(0 ${-liftL})`);
    footR.setAttribute('transform', `translate(0 ${-liftR})`);
    armL.setAttribute('transform', `rotate(${tilt * 2.2} -19 -6)`);
    armR.setAttribute('transform', `rotate(${-tilt * 2.2} 19 -6)`);
    // 主人公の配置：transformで移動＋左右反転＋体の傾き
    playerEl.setAttribute('transform', `translate(${px + swayX} ${py + bobY})`);
    penguinEl.setAttribute('transform', `scale(${face} 1) rotate(${tilt})`);

    // スライム：主人公をゆっくり追いかける＋ぷよぷよ変形
    const vx = px - sx, vy = py - sy, vl = Math.hypot(vx, vy) || 1;
    sx += vx / vl * 55 * dt; sy += vy / vl * 55 * dt;
    const sq = 1 + Math.sin(now / 150) * 0.08;
    slimeEl.setAttribute('transform', `translate(${sx} ${sy}) scale(1 ${sq})`);

    // 星を取った？
    if (hit(px, py, star.x, star.y, 30)) { score++; scoreEl.textContent = score; placeStar(); }
    // スライムに当たった？
    if (hit(px, py, sx, sy, 30)) { score = Math.max(0, score - 1); scoreEl.textContent = score; px = 320; py = 200; }

    // 時間
    secTimer += dt;
    if (secTimer >= 1) {
      secTimer = 0; timeLeft--; timeEl.textContent = timeLeft;
      if (timeLeft <= 0) {
        running = false;
        msgEl.textContent = `終了！ スコア ${score}`;
        msgEl.style.display = '';
      }
    }
  }
  requestAnimationFrame(loop);
}
placeStar();
playerEl.setAttribute('transform', `translate(${px} ${py})`);
slimeEl.setAttribute('transform', `translate(${sx} ${sy})`);
requestAnimationFrame(loop);
</script>
</body>
</html>
