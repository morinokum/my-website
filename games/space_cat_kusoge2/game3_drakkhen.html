                partyContainer.innerHTML += `<div class="flex-1 bg-slate-700/50 rounded p-1 flex flex-col items-center justify-center border border-slate-600 relative overflow-hidden transition-colors" id="hero-card-${i}"><div class="text-[10px] sm:text-xs text-slate-300 font-bold mb-0.5">${hero.name}</div><div class="text-xl sm:text-2xl">${hero.icon}</div><div class="w-full bg-red-950/80 h-1.5 sm:h-2 mt-1 rounded-full overflow-hidden border border-slate-900"><div id="hp-bar-${i}" class="bg-gradient-to-r from-emerald-500 to-emerald-400 h-full transition-all duration-300" style="width: 100%"></div></div><div class="text-[9px] sm:text-[10px] mt-1 text-slate-400 font-mono">Lv <span id="lvl-${i}" class="text-white">${hero.lvl}</span></div></div>`;
            });
            updateUpgradesUI();
        }
        function getUpgradeCost(hero) { return Math.floor(40 * Math.pow(1.6, hero.lvl - 1)); }
        function getHealCost() { return 15 * state.party.reduce((max, h) => Math.max(max, h.lvl), 1); }
        function updateUpgradesUI() {
            const container = document.getElementById('upgrades-list');
            container.innerHTML = `<button id="btn-heal" onclick="healAll()" class="w-full bg-emerald-700 hover:bg-emerald-600 text-white font-bold py-2 sm:py-3 px-4 rounded mb-2 shadow-lg active:scale-95 transition-all flex justify-between items-center border border-emerald-500"><span class="text-sm sm:text-base">💊 全体回復 (Revive)</span><span class="bg-black/40 px-2 py-1 rounded text-xs sm:text-sm font-mono" id="cost-heal">💰 ${getHealCost()}</span></button>`;
            state.party.forEach((hero, i) => {
                let cost = getUpgradeCost(hero);
                container.innerHTML += `<div class="bg-slate-800 rounded p-2 sm:p-3 flex justify-between items-center border border-slate-700 shadow-sm" id="upgrade-box-${i}"><div class="flex items-center gap-2 sm:gap-3"><div class="text-xl sm:text-2xl bg-slate-900 p-1.5 rounded border border-slate-700">${hero.icon}</div><div><div class="font-bold text-xs sm:text-sm text-slate-200">${hero.name} <span class="text-slate-400 font-normal ml-1">Lv ${hero.lvl}</span></div><div class="text-[10px] sm:text-xs text-slate-400 font-mono mt-0.5">HP:${hero.maxHp} ATK:${hero.atk} DEF:${hero.def}</div></div></div><button id="btn-upgrade-${i}" onclick="upgradeHero(${i})" class="bg-slate-600 text-slate-400 font-bold py-1.5 sm:py-2 px-3 sm:px-4 rounded text-xs sm:text-sm active:scale-95 transition-all min-w-[80px]">強化 💰 ${cost}</button></div>`;
            });
        }
        function upgradeHero(idx) {
            let hero = state.party[idx], cost = getUpgradeCost(hero);
            if (state.gold >= cost) { state.gold -= cost; hero.lvl++; hero.maxHp = Math.floor(hero.maxHp * 1.25); hero.hp = hero.maxHp; hero.atk = Math.floor(hero.atk * 1.25); hero.def = Math.floor(hero.def * 1.25); updateUpgradesUI(); updatePartyUI(); setLog(`${hero.name} がレベルアップした！`); }
        }
        function healAll() {
            let cost = getHealCost();
            if (state.gold >= cost && state.party.some(h => h.hp < h.maxHp)) { state.gold -= cost; state.party.forEach(h => h.hp = h.maxHp); updateUpgradesUI(); updatePartyUI(); setLog(`パーティーは休息し、活力を取り戻した。`); }
        }
        function setLog(msg) { document.getElementById('log-display').innerText = msg; }
        function updatePartyUI() {
            state.party.forEach((hero, i) => {
                let bar = document.getElementById(`hp-bar-${i}`);
                if(bar) { let pct = Math.max(0, hero.hp / hero.maxHp) * 100; bar.style.width = `${pct}%`; }
                let lvl = document.getElementById(`lvl-${i}`); if(lvl && lvl.innerText != hero.lvl) lvl.innerText = hero.lvl;
            });
            document.getElementById('gold-display').innerText = state.gold.toLocaleString();
            document.getElementById('day-display').innerText = state.day;
            document.getElementById('biome-display').innerText = BIOMES[state.biomeIdx].name;
            state.party.forEach((hero, i) => {
                let btn = document.getElementById(`btn-upgrade-${i}`), box = document.getElementById(`upgrade-box-${i}`);
                if(btn && box) {
                    let cost = getUpgradeCost(hero);
                    btn.className = state.gold >= cost ? "bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-1.5 sm:py-2 px-3 sm:px-4 rounded text-xs sm:text-sm active:scale-95 transition-all shadow-md" : "bg-slate-600 text-slate-400 font-bold py-1.5 sm:py-2 px-3 sm:px-4 rounded text-xs sm:text-sm active:scale-95 transition-all";
                }
            });
            let healBtn = document.getElementById('btn-heal'), costHealDisplay = document.getElementById('cost-heal');
            if(healBtn && costHealDisplay) { let cost = getHealCost(); costHealDisplay.innerText = `💰 ${cost}`; healBtn.classList.toggle('opacity-50', state.gold < cost); healBtn.classList.toggle('pointer-events-none', state.gold < cost); }
        }
        function flashHeroCard(idx) { let el = document.getElementById(`hero-card-${idx}`); if(el) { el.classList.add('bg-red-900/80', 'border-red-500'); setTimeout(() => el.classList.remove('bg-red-900/80', 'border-red-500'), 150); } }
        let resetClicks = 0;
        function handleReset(btn) {
            if (resetClicks === 0) { btn.innerText = "本当にリセットしますか？(もう一度タップ)"; resetClicks++; setTimeout(() => { resetClicks = 0; btn.innerText = "データリセット"; }, 3000); }
            else { localStorage.removeItem('drakkhenIdleSave'); location.reload(); }
        }
        const canvas = document.getElementById('gameCanvas'), ctx = canvas.getContext('2d', { alpha: false });
        let width, height;
        function resize() { const parent = document.getElementById('viewport'); width = parent.clientWidth; height = parent.clientHeight; canvas.width = width * 0.75; canvas.height = height * 0.75; ctx.scale(0.75, 0.75); }
        window.addEventListener('resize', resize);
        const mountains = Array.from({length: 15}, () => ({ x: Math.random(), size: 0.1 + Math.random() * 0.6 }));
        function getSkyGradient(time) { if (time >= 4 && time < 7) return ['#ff7e5f', '#3a6073']; if (time >= 7 && time < 16) return ['#4facfe', '#00f2fe']; if (time >= 16 && time < 19) return ['#f5576c', '#203a43']; return ['#0f2027', '#111827']; }

        function spawnMonster() {
            state.encounterCount++;
            let diffMult = Math.pow(1.15, Math.floor(state.distance / 100)), type;
            if (state.encounterCount % 10 === 0) { type = MONSTER_TYPES[5]; setLog("大地が震える...エンシェントドラゴンが現れた！"); if (window._scDrakCat) window._scDrakCat.say('ボスのエンシェントドラゴンが出たにゃ！！', 'angry'); }
            else { let maxIdx = Math.min(4, Math.floor(state.distance / 150) + 1); type = MONSTER_TYPES[Math.floor(Math.random() * maxIdx)]; setLog(`前方に影が見える...`); }
            state.monster = { emoji: type.emoji, name: type.name, type: type.type, maxHp: Math.floor(type.baseHp * diffMult), hp: Math.floor(type.baseHp * diffMult), atk: Math.floor(type.baseAtk * diffMult), def: Math.floor(type.baseDef * diffMult), reward: Math.floor(type.reward * diffMult), dist: 12.0, dead: false, attackTimer: 2.5 };
        }
        function spawnProjectile(heroIdx, tx, ty) { state.particles.push({ x: canvas.width * (0.15 + heroIdx * 0.23), y: canvas.height, tx: tx, ty: ty, life: 0.2, maxLife: 0.2, color: ['#fff', '#f00', '#0ff', '#f0f'][heroIdx], type: 'proj' }); }
        function spawnText(text, x, y, color = '#ffffff') { state.particles.push({ x: x + (Math.random() - 0.5) * 60, y: y - Math.random() * 40, vx: 0, vy: -40, life: 1.0, maxLife: 1.0, text: text, color: color, type: 'text' }); }
        function update(dt) {
            state.time += dt * 0.2; if (state.time >= 24) { state.time -= 24; state.day++; }
            state.biomeIdx = Math.floor(Math.max(0, state.distance) / 400) % BIOMES.length;
            if (state.screenFlash > 0) state.screenFlash -= dt * 4;
            if (state.gameMode === 'walking') { state.distance += dt * 3.0; if (state.distance >= state.nextEncounter) { state.gameMode = 'approaching'; spawnMonster(); } }
            else if (state.gameMode === 'approaching') { state.monster.dist -= dt * 6.0; if (state.monster.dist <= 1.0) { state.monster.dist = 1.0; state.gameMode = 'fighting'; setLog(`${state.monster.name} が襲いかかってきた！`); } }
            else if (state.gameMode === 'fighting' && state.monster && !state.monster.dead) {
                let m = state.monster, mx = canvas.width / 2, my = canvas.height / 2;
                state.party.forEach((hero, i) => {
                    if (hero.hp > 0) { hero.timer -= dt; if (hero.timer <= 0) { let dmg = Math.max(1, hero.atk - m.def + Math.floor(Math.random()*4)); if (Math.random() < 0.15) dmg = Math.floor(dmg * 1.8); m.hp -= dmg; spawnProjectile(i, mx, my); setTimeout(() => spawnText(dmg, mx, my, '#ffffff'), 200); hero.timer = hero.cooldown * (0.8 + Math.random()*0.4); } }
                });
                m.attackTimer -= dt;
                if (m.attackTimer <= 0) {
                    let alive = state.party.map((h, idx) => ({h, idx})).filter(x => x.h.hp > 0);
                    if (alive.length > 0) { let target = alive[Math.floor(Math.random() * alive.length)]; let dmg = Math.max(1, m.atk - target.h.def + Math.floor(Math.random()*6)); target.h.hp = Math.max(0, target.h.hp - dmg); flashHeroCard(target.idx); state.screenFlash = 1.0; spawnText(dmg, canvas.width*(0.15 + target.idx*0.23), canvas.height - 20, '#ff4444'); m.attackTimer = (m.type === 'boss' ? 1.5 : 2.0); }
                }
                if (state.party.filter(h => h.hp > 0).length === 0) {
                    state.gameMode = 'dead'; setLog("パーティーは全滅した...");
                    if (window._scDrakCat) window._scDrakCat.say('全滅しちゃったにゃ！ でもレベルとGは残るから強化してリベンジにゃ！', 'angry');
                    setTimeout(() => { state.party.forEach(h => h.hp = h.maxHp); state.monster = null; state.gameMode = 'walking'; state.distance = Math.max(0, state.distance - 50); state.nextEncounter = state.distance + 20; setLog("拠点で再起し、再び旅に出た。"); updatePartyUI(); }, 3500);
                } else if (m.hp <= 0) {
                    m.dead = true; state.gold += m.reward; spawnText("撃破！", mx, my - 60, '#00ff00'); spawnText(`+${m.reward} G`, mx, my - 30, '#ffff00'); setLog(`${m.name} を倒した！ (+${m.reward}G)`);
                    if (m.type === 'boss' && !state.bossDefeated) {
                        state.bossDefeated = true;
                        try { const p = JSON.parse(localStorage.getItem('SPACE_CAT_KUSOGE_S2_CLEAR_v1') || '{}'); p.game3 = true; localStorage.setItem('SPACE_CAT_KUSOGE_S2_CLEAR_v1', JSON.stringify(p)); } catch(e) {}
                        if (window._scDrakCat) window._scDrakCat.say('エンシェントドラゴン撃破おめでとうにゃ！！ 試練3クリアにゃ！', 'smile', 10000);
                        setTimeout(() => { document.getElementById('clear-modal').classList.remove('hidden'); }, 1000);
                    }
                    setTimeout(() => { state.gameMode = 'walking'; state.monster = null; state.nextEncounter = state.distance + 15 + Math.random() * 20; updateUpgradesUI(); }, 1200);
                }
            }
            for (let i = state.particles.length - 1; i >= 0; i--) { let p = state.particles[i]; p.life -= dt; if (p.life <= 0) state.particles.splice(i, 1); else if (p.type === 'text') { p.x += p.vx * dt; p.y += p.vy * dt; } }
        }
        function draw() {
            const w = canvas.width, h = canvas.height, horizon = h * 0.45;
            let skyColor = getSkyGradient(state.time), skyGrad = ctx.createLinearGradient(0, 0, 0, horizon); skyGrad.addColorStop(0, skyColor[0]); skyGrad.addColorStop(1, skyColor[1]); ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, w, horizon);
            let b = BIOMES[state.biomeIdx], groundGrad = ctx.createLinearGradient(0, horizon, 0, h); groundGrad.addColorStop(0, b.groundEnd); groundGrad.addColorStop(1, b.groundStart); ctx.fillStyle = groundGrad; ctx.fillRect(0, horizon, w, h - horizon);
            ctx.strokeStyle = b.line; ctx.lineWidth = 1.5;
            let moveOffset = (state.distance % 6) / 6;
            for (let i = 1; i <= 15; i++) { let z = i - moveOffset; if (z <= 0.1) continue; let y = horizon + (h - horizon) * (1.5 / z); if (y > horizon && y <= h * 1.5) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); } }
            for(let i = -15; i <= 15; i++) { ctx.beginPath(); ctx.moveTo(w/2, horizon); ctx.lineTo(w/2 + i * (w / 4), h); ctx.stroke(); }
            if (state.monster) {
                let m = state.monster, scale = 1.0 / m.dist, size = Math.min(h * 1.5, (h * 0.8) * scale), mx = w/2, my = horizon + (h - horizon) * scale + size*0.1;
                ctx.font = `${size}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
                ctx.save(); if (m.dead) ctx.globalAlpha = 0.3; ctx.fillText(m.emoji, mx, my);
                if (!m.dead && m.dist < 3.0) { let bw = size * 0.6, bh = size * 0.08, bx = mx - bw/2, by = my - size - bh - 10; ctx.fillStyle = '#450a0a'; ctx.fillRect(bx, by, bw, bh); ctx.fillStyle = m.type === 'boss' ? '#dc2626' : '#ea580c'; ctx.fillRect(bx, by, bw * Math.max(0, m.hp / m.maxHp), bh); }
                ctx.restore();
            }
            state.particles.forEach(p => {
                if (p.type === 'proj') { let t = 1.0 - (p.life / p.maxLife); ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x + (p.tx - p.x) * t, p.y + (p.ty - p.y) * t * t, 4, 0, Math.PI * 2); ctx.fill(); }
                else if (p.type === 'text') { ctx.font = 'bold 22px sans-serif'; ctx.fillStyle = p.color; ctx.textAlign = 'center'; ctx.globalAlpha = p.life / p.maxLife; ctx.fillText(p.text, p.x, p.y); ctx.globalAlpha = 1.0; }
            });
            if (state.screenFlash > 0) { ctx.fillStyle = `rgba(220, 38, 38, ${state.screenFlash * 0.4})`; ctx.fillRect(0, 0, w, h); }
        }
        function saveGame() { state.lastSaveTime = Date.now(); localStorage.setItem('drakkhenIdleSave', JSON.stringify({ gold: state.gold, distance: state.distance, day: state.day, time: state.time, biomeIdx: state.biomeIdx, encounterCount: state.encounterCount, bossDefeated: state.bossDefeated, party: state.party.map(h => ({ lvl: h.lvl, hp: h.hp, maxHp: h.maxHp, atk: h.atk, def: h.def })), lastSaveTime: state.lastSaveTime })); }
        function loadGame() {
            let saved = localStorage.getItem('drakkhenIdleSave');
            if (saved) { try { let data = JSON.parse(saved); state.gold = data.gold; state.distance = data.distance; state.day = data.day; state.time = data.time || 8; state.biomeIdx = data.biomeIdx || 0; state.encounterCount = data.encounterCount || 0; state.bossDefeated = !!data.bossDefeated; data.party.forEach((p, i) => { state.party[i].lvl = p.lvl; state.party[i].hp = p.hp; state.party[i].maxHp = p.maxHp; state.party[i].atk = p.atk; state.party[i].def = p.def; }); } catch(e) {} }
        }
        let lastTime = performance.now(), accumulator = 0;
        function gameLoop(now) {
            let frameTime = Math.min(1.0, (now - lastTime) / 1000); lastTime = now; accumulator += frameTime;
            while (accumulator >= 0.05) { update(0.05); accumulator -= 0.05; }
            draw(); requestAnimationFrame(gameLoop);
        }
        setInterval(updatePartyUI, 300); setInterval(saveGame, 10000);
        window.onload = () => { loadGame(); initUI(); resize(); requestAnimationFrame(gameLoop); };
    </script>
    <script src="assets/spacecat.js"></script>
    <script>
      window._scDrakCat = SpaceCat.createFloatingWidget(
        '放置RPGスタートにゃ！ 10戦目に現れるエンシェントドラゴンを倒すにゃ！',
        [
          { text: 'お金が貯まったら下のリストからどんどん強化するにゃ！', mood: 'normal' },
          { text: '全滅してもペナルティは少し後退するだけだから安心するにゃ！', mood: 'smile' }
        ],
        function() {
          if (state.bossDefeated) return { text: '【クリア済】ポータルへ戻って報告するにゃ！', mood: 'smile' };
          const rem = 10 - (state.encounterCount % 10);
          if (state.monster && state.monster.type === 'boss') return { text: '【決戦中】今戦ってるのがエンシェントドラゴンにゃ！ 回復や強化を連打して勝つにゃ！', mood: 'angry' };
          return { text: `【ヒント】あと ${rem} 回エンカウントするとボスのエンシェントドラゴンが出るにゃ！ 今のうちにパーティを強化しておくにゃ！`, mood: 'normal' };
        }
      );
    </script>
