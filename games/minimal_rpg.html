<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- AI-GAME-PORTFOLIO -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ミニマム文字RPG：ストーリー討伐</title>
  <style>
    body { font-family: 'Courier New', Courier, monospace; background-color: #0d0d0d; color: #00ff66; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
    .game-container { width: 100%; max-width: 600px; background: #141414; border: 2px solid #00ff66; border-radius: 6px; padding: 25px; box-shadow: 0 0 20px rgba(0,255,102,0.2); }
    h1 { margin-top: 0; font-size: 1.5em; text-align: center; border-bottom: 1px dashed #00ff66; padding-bottom: 10px; color: #fff; }
    .screen { display: none; }
    .screen.active { display: block; }
    textarea { width: 100%; height: 120px; background: #000; color: #00ff66; border: 1px solid #00ff66; padding: 10px; font-family: monospace; font-size: 1em; resize: none; box-sizing: border-box; margin-bottom: 15px; }
    button { background: #00ff66; color: #000; border: none; padding: 12px 20px; font-weight: bold; cursor: pointer; font-family: monospace; font-size: 1em; width: 100%; }
    button:hover { background: #00cc52; }
    .status-bar { display: flex; justify-content: space-between; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; font-size: 0.85em; color: #aaa; flex-wrap: wrap; gap: 5px; }
    .status-bar span { color: #00ff66; font-weight: bold; }
    .story-box { background: #1a1a1a; border: 1px dashed #444; padding: 15px; margin-bottom: 15px; min-height: 70px; max-height: 100px; overflow-y: auto; line-height: 1.6; color: #ddd; word-break: break-all; }
    .enemy-box { background: #2a0a0a; border: 1px solid #ff3333; color: #ff6666; padding: 15px; text-align: center; margin-bottom: 15px; font-size: 1.2em; font-weight: bold; word-break: break-all; }
    .log-box { background: #000; border: 1px solid #333; padding: 10px; height: 110px; overflow-y: auto; font-size: 0.85em; color: #888; margin-bottom: 15px; }
    .btn-group { display: flex; gap: 10px; }
  </style>
</head>
<body>
  <div class="game-container">
    <h1>MINIMAL TEXT RPG</h1>

    <!-- ステージ1：ストーリー入力 -->
    <div id="screen-input" class="screen active">
      <p>ハードなストーリーを入力してください。<br>文字コードが持つ「重み」によって凶悪な敵が出現します。生き残れるか？</p>
      <textarea id="story-input" placeholder="例：魔王討伐の旅に出た勇者は、幾多の試練に直面する……"></textarea>
      <button id="start-btn">冒険をはじめる</button>
    </div>

    <!-- ステージ2：バトル＆進行 -->
    <div id="screen-battle" class="screen">
      <div class="status-bar">
        <div>Lv: <span id="stat-lv">1</span></div>
        <div>HP: <span id="stat-hp">40</span>/<span id="stat-maxhp">40</span></div>
        <div>EXP: <span id="stat-exp">0</span>/<span id="stat-next">15</span></div>
        <div>進捗: <span id="stat-progress">0</span>%</div>
      </div>

      <div style="font-size: 0.8em; color: #888; margin-bottom: 3px;">【いま読んでいるストーリー】</div>
      <div id="current-story" class="story-box"></div>

      <div style="font-size: 0.8em; color: #888; margin-bottom: 3px;">【現在の文字の敵】</div>
      <div id="enemy-text" class="enemy-box"></div>

      <div id="battle-log" class="log-box"></div>

      <div class="btn-group">
        <button id="attack-btn">攻撃する (文字を削る)</button>
      </div>
    </div>

    <!-- ステージ3：ゲームオーバー -->
    <div id="screen-gameover" class="screen" style="text-align: center;">
      <h2 style="color: #ff3333;">💀 敗北……</h2>
      <p>文字の重みに押しつぶされてしまいました。戦略を見直して再挑戦を！</p>
      <button id="retry-btn">もう一度挑戦する</button>
    </div>

    <!-- ステージ4：クリア画面 -->
    <div id="screen-clear" class="screen" style="text-align: center;">
      <h2 style="color: #00ff66;">🎉 激闘クリア！</h2>
      <p>すべての文字の敵を討伐し、過酷な物語を完走しました！</p>
      <button id="reset-btn">別のストーリーで遊ぶ</button>
    </div>
  </div>

  <script>
    let chunks = [];
    let currentIndex = 0;
    let lv = 1;
    let hp = 40;
    let maxHp = 40;
    let exp = 0;
    let nextExp = 15;
    let currentEnemy = "";
    let enemyHp = 0;
    let enemyMaxHp = 0;
    let enemyAtk = 1;
    let savedStoryText = ""; // リトライ用に保持

    function startGame() {
      const inputEl = document.getElementById("story-input");
      const text = inputEl ? inputEl.value.trim() : "";
      
      if (!text) {
        alert("ストーリーを入力してください！");
        return;
      }
      
      savedStoryText = text; // 入力内容を保存
      initGameData();
    }

    function initGameData() {
      chunks = [];
      for (let i = 0; i < savedStoryText.length; i += 2) {
        chunks.push(savedStoryText.substr(i, 2));
      }
      
      currentIndex = 0;
      lv = 1;
      maxHp = 40; // 初期HPを少し増やして安定感を向上
      hp = maxHp;
      exp = 0;
      nextExp = 15;
      
      changeScreen('screen-battle');
      document.getElementById("battle-log").innerHTML = "";
      
      loadNextEnemy();
      updateStatus();
    }

    function loadNextEnemy() {
      if (currentIndex >= chunks.length) {
        changeScreen('screen-clear');
        return;
      }
      
      currentEnemy = chunks[currentIndex];
      
      // ★文字コード（charCodeAt）を活用しつつ、平方根で極端なインフレを緩和
      let charCodeSum = 0;
      for (let i = 0; i < currentEnemy.length; i++) {
        charCodeSum += currentEnemy.charCodeAt(i);
      }
      
      // 敵のHP：文字コードの重みを活かしつつマイルドにスケーリング
      enemyMaxHp = Math.floor(Math.sqrt(charCodeSum) * 1.5) + (currentEnemy.length * 4);
      if (enemyMaxHp < 6) enemyMaxHp = 6;
      enemyHp = enemyMaxHp;
      
      // 敵の反撃：理不尽なワンパンを防ぐため、上限や補正を調整
      enemyAtk = Math.max(2, Math.floor(charCodeSum / 400) + Math.floor(currentIndex / 5) + Math.floor(lv / 2));

      let readText = chunks.slice(0, currentIndex).join("");
      document.getElementById("current-story").innerText = readText || "(物語の始まり)";
      document.getElementById("enemy-text").innerText = `「${currentEnemy}」 (HP: ${enemyHp}/${enemyMaxHp} / 攻撃力: ${enemyAtk})`;
      
      logMessage(`⚠ 凶悪な文字の敵「${currentEnemy}」が現れた！（HP: ${enemyMaxHp}, 攻撃力: ${enemyAtk}）`);
      updateStatus();
    }

    function attackEnemy() {
      // プレイヤーの攻撃：レベルアップによる成長を実感しやすく強化
      let damage = lv * 4 + Math.floor(Math.random() * 5) + 2;
      
      // まれにクリティカル (15%の確率でダメージ1.5倍)
      let isCritical = Math.random() < 0.15;
      if (isCritical) {
        damage = Math.floor(damage * 1.5);
      }

      enemyHp -= damage;
      if (enemyHp < 0) enemyHp = 0;

      if (isCritical) {
        logMessage(`⚡ クリティカルヒット！ ${currentEnemy} に ${damage} の大ダメージ！（敵残りHP: ${enemyHp}）`);
      } else {
        logMessage(`あなたの攻撃！ ${currentEnemy} に ${damage} のダメージ！（敵残りHP: ${enemyHp}）`);
      }
      
      document.getElementById("enemy-text").innerText = `「${currentEnemy}」 (HP: ${enemyHp}/${enemyMaxHp} / 攻撃力: ${enemyAtk})`;

      if (enemyHp <= 0) {
        let gainedExp = currentEnemy.length * 10 + Math.floor(enemyMaxHp / 2);
        exp += gainedExp;
        logMessage(`▶ 「${currentEnemy}」を撃破！ EXP +${gainedExp}`);
        
        // レベルアップ判定
        if (exp >= nextExp) {
          lv++;
          exp -= nextExp;
          nextExp = Math.floor(nextExp * 1.5);
          maxHp += 12;
          hp = maxHp; // レベルアップで完全回復の恩恵
          logMessage(`✨ レベルアップ！ Lv.${lv} になった！ HPが完全回復した！（最大HP: ${maxHp}）`);
        }

        currentIndex++;
        loadNextEnemy();
      } else {
        // 敵からの反撃
        hp -= enemyAtk;
        if (hp < 0) hp = 0;
        logMessage(`💥 敵の反撃！ ${currentEnemy} から ${enemyAtk} のダメージ！（あなたのHP: ${hp}/${maxHp})`);

        if (hp <= 0) {
          logMessage(`💀 致命傷を負い、力尽きてしまった……`);
          changeScreen('screen-gameover');
          updateStatus();
          return;
        }
      }
      updateStatus();
    }

    function updateStatus() {
      document.getElementById("stat-lv").innerText = lv;
      document.getElementById("stat-hp").innerText = hp;
      document.getElementById("stat-maxhp").innerText = maxHp;
      document.getElementById("stat-exp").innerText = exp;
      document.getElementById("stat-next").innerText = nextExp;
      
      let progress = Math.floor((currentIndex / chunks.length) * 100);
      document.getElementById("stat-progress").innerText = progress;
    }

    function changeScreen(screenId) {
      document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function logMessage(msg) {
      const logBox = document.getElementById("battle-log");
      if (logBox) {
        logBox.innerHTML += `<div>> ${msg}</div>`;
        logBox.scrollTop = logBox.scrollHeight;
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      const setupBtn = (id, handler) => {
        const btn = document.getElementById(id);
        if (btn) btn.addEventListener("click", handler);
      };

      setupBtn("start-btn", startGame);
      setupBtn("attack-btn", attackEnemy);
      // リトライ時は同じストーリーで再挑戦できるように変更
      setupBtn("retry-btn", () => {
        if (savedStoryText) {
          initGameData();
        } else {
          changeScreen('screen-input');
        }
      });
      setupBtn("reset-btn", () => {
        changeScreen('screen-input');
        const inputEl = document.getElementById("story-input");
        if (inputEl) inputEl.value = "";
      });
    });
  </script>
</body>
</html>
