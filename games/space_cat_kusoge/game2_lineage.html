<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI-GAME-PORTFOLIO">
    <title>絶対絶望獣：神殺しの系譜</title>
    <style>
        :root { --bg-dark: #0a0a0c; --panel-bg: #1a1a20; --border-color: #333; --accent-red: #c22; --text-main: #e0e0e0; --text-muted: #888; --hp-fill: #b11; --part-hp: #2a8; }
        body { background-color: var(--bg-dark); color: var(--text-main); font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #boss-ui { background-color: #111; padding: 15px; border-bottom: 2px solid var(--accent-red); flex-shrink: 0; }
        #boss-hp-bar-container { width: 100%; background-color: #333; height: 35px; position: relative; border: 1px solid #000; box-shadow: inset 0 0 10px rgba(0,0,0,0.8); }
        #boss-hp-bar { width: 100%; background: linear-gradient(90deg, #600, var(--hp-fill), #f00); height: 100%; transition: width 0.3s ease-out; }
        #boss-hp-text { position: absolute; top: 50%; left: 15px; transform: translateY(-50%); font-weight: bold; font-size: 1.1em; text-shadow: 1px 1px 3px #000, -1px -1px 3px #000; letter-spacing: 1px; pointer-events: none; }
        .parts-container { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
        .part-box { flex: 1; min-width: 120px; background-color: #222; padding: 10px; border: 1px solid var(--border-color); text-align: center; border-radius: 4px; }
        .part-name { font-weight: bold; font-size: 0.95em; margin-bottom: 5px; }
        .part-desc { font-size: 0.75em; color: var(--text-muted); margin-bottom: 8px; height: 32px; overflow: hidden; }
        .part-hp-bar { width: 100%; background: #444; height: 8px; border-radius: 4px; overflow: hidden; }
        .part-hp-fill { width: 100%; background: var(--part-hp); height: 100%; transition: width 0.3s; }
        #main-ui { display: flex; flex: 1; overflow: hidden; flex-direction: column; }
        @media(min-width: 768px) { #main-ui { flex-direction: row; } }
        #left-panel { flex: 1; padding: 20px; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; background-color: var(--panel-bg); overflow-y: auto; }
        #right-panel { flex: 1; padding: 20px; overflow-y: auto; background-color: #0d0d0f; }
        .hero-info { margin-bottom: 25px; padding: 20px; background-color: #2a2a30; border: 1px solid #444; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.5); }
        .hero-title { margin: 0 0 15px 0; color: #eda; font-size: 1.4em; border-bottom: 1px solid #555; padding-bottom: 5px; }
        .hero-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; font-size: 1.1em; }
        .life-text { font-size: 1.2em; }
        .life-warning { color: var(--accent-red); font-weight: bold; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        button { background-color: #333; color: #fff; border: 1px solid #555; padding: 15px; cursor: pointer; font-size: 1em; border-radius: 6px; transition: all 0.2s; font-weight: bold; }
        button:hover:not(:disabled) { background-color: #4a4a4a; transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        button:active:not(:disabled) { transform: translateY(0); }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-boss { background-color: #611; border-color: #a22; color: #fcc; }
        .btn-boss:hover:not(:disabled) { background-color: #822; }
        .log-entry { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dashed #333; line-height: 1.4; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
        .log-turn { color: #668; font-size: 0.85em; margin-right: 8px; }
        .log-damage { color: #f66; font-weight: bold; }
        .log-system { color: #eda; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background-color: var(--panel-bg); padding: 25px; border: 1px solid #555; border-radius: 10px; width: 90%; max-width: 600px; max-height: 80vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .upgrade-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #333; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(20, 0, 0, 0.95); z-index: 200; justify-content: center; align-items: center; flex-direction: column; text-align: center; padding: 20px; box-sizing: border-box; }
        .overlay h1 { color: #f33; font-size: 2.5em; margin-bottom: 16px; text-shadow: 0 0 10px #f00; }
        .overlay p { color: #ddd; font-size: 1.1em; line-height: 1.6; margin-bottom: 24px; }
        .clear-overlay { background: rgba(30, 30, 20, 0.95); }
        .clear-overlay h1 { color: #fd4; text-shadow: 0 0 20px #fa0; }
        .portal-back { position: fixed; bottom: 14px; right: 14px; z-index: 90; background: rgba(20,20,30,0.9); color: #eda; border: 1px solid #eda; padding: 8px 14px; border-radius: 8px; text-decoration: none; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>
<a href="index.html" class="portal-back">◀ ポータルへ戻る</a>
<div id="boss-ui">
    <div id="boss-hp-bar-container"><div id="boss-hp-bar"></div><div id="boss-hp-text">災厄の巨獣 HP: -- / --</div></div>
    <div class="parts-container" id="parts-container"></div>
</div>
<div id="main-ui">
    <div id="left-panel">
        <div class="hero-info" id="hero-info"></div>
        <div id="action-panel" class="actions">
            <button onclick="game.train()">修練<br><span style="font-size:0.8em; font-weight:normal;">(寿命 -1)</span></button>
            <button onclick="game.explore()">探索<br><span style="font-size:0.8em; font-weight:normal;">(寿命 -1)</span></button>
            <button onclick="game.openBase()">一族の拠点<br><span style="font-size:0.8em; font-weight:normal;">(施設・血脈強化)</span></button>
            <button class="btn-boss" onclick="game.startBossBattle()">巨獣に挑む<br><span style="font-size:0.8em; font-weight:normal;">(決戦 / 寿命全消費)</span></button>
        </div>
        <div id="battle-panel" class="actions" style="display: none;">
            <button onclick="game.attackBoss('shell')" id="btn-atk-shell">外殻を攻撃</button>
            <button onclick="game.attackBoss('rightArm')" id="btn-atk-arm">右腕を攻撃</button>
            <button onclick="game.attackBoss('core')" id="btn-atk-core" class="btn-boss">本体(コア)を攻撃</button>
            <button onclick="game.fleeBattle()" style="background-color:#444;">戦意喪失 (自害)</button>
        </div>
    </div>
    <div id="right-panel"><div id="logs"></div></div>
</div>
<div id="base-modal" class="modal">
    <div class="modal-content">
        <h2 style="margin-top:0; color:#eda; border-bottom:1px solid #555; padding-bottom:10px;">一族の拠点</h2>
        <p>所持 遺産ポイント (LP): <span id="modal-lp" style="color:#eda; font-weight:bold; font-size:1.2em;">0</span></p>
        <div id="upgrades-container" style="margin-top:20px;"></div>
        <button onclick="game.closeBase()" style="margin-top:20px; width:100%; background:#444;">拠点を出る</button>
    </div>
</div>
<div id="death-overlay" class="overlay">
    <h1>勇者は斃れた</h1>
    <p id="death-desc"></p>
    <button onclick="game.nextGeneration()" style="font-size:1.2em; padding:15px 40px; background:#a22; border-color:#f55;">次世代へ希望を託す</button>
</div>

    <h1>試 練 2 ク リ ア</h1>
    <p id="clear-desc"></p>
    <div style="display:flex; gap:12px; flex-wrap:wrap; justify-content:center;">
        <a href="index.html?cleared=game2" style="font-size:1.1em; padding:14px 28px; background:#10b981; border-radius:8px; color:#000; font-weight:bold; text-decoration:none;">スペース猫にクリアを報告する</a>

</div>
<script>
const SAVE_KEY = 'LineageRPG_Save';
const INITIAL_BOSS_HP = 500000000;
const DEFAULT_STATE = {
    boss: { maxHp: INITIAL_BOSS_HP, currentHp: INITIAL_BOSS_HP, parts: { shell: { name: '強固な外殻', maxHp: 1500000, currentHp: 1500000, broken: false, effectDesc: '本体へのダメージを 1/100 に軽減' }, rightArm: { name: '巨獣の剛腕', maxHp: 6000000, currentHp: 6000000, broken: false, effectDesc: '毎ターン即死級の猛攻を放つ' }, core: { name: '巨獣の核(本体)', maxHp: INITIAL_BOSS_HP, currentHp: INITIAL_BOSS_HP, broken: false, effectDesc: 'HPを0にすれば討伐完了' } } },
    lineage: { generation: 1, legacyPoints: 0, upgrades: { trainingFacility: { level: 1, name: '修練所の拡張', desc: '修練でのステータス上昇量が飛躍的にアップ', baseCost: 10, costMult: 2.2 }, explorationGear: { level: 1, name: '探索網の開拓', desc: '探索での遺産ポイント(LP)獲得量が飛躍的にアップ', baseCost: 10, costMult: 2.2 }, lifeExtender: { level: 0, name: '生命の秘薬', desc: '次世代の初期寿命(ターン数)が少し伸びる', baseCost: 50, costMult: 3.0 }, baseStats: { level: 0, name: '血脈の覚醒', desc: '次世代の初期ステータス(STR/VIT)の底上げ', baseCost: 80, costMult: 3.5 } } },
    hero: { life: 50, maxLife: 50, hp: 100, maxHp: 100, stats: { str: 5, vit: 5, agi: 5 }, isBattling: false }
};
let state = null;
function markGame2Cleared() {
    try { const p = JSON.parse(localStorage.getItem('SPACE_CAT_KUSOGE_CLEAR_v1') || '{}'); p.game2 = true; localStorage.setItem('SPACE_CAT_KUSOGE_CLEAR_v1', JSON.stringify(p)); } catch(e) {}
}
const game = {
    init() { this.load(); this.updateUI(); this.log("システム", `<span class="log-system">第 ${state.lineage.generation} 代の物語が幕を開けた。</span>`); if(state.hero.isBattling) { this.log("システム", "時空の乱れにより、勇者は致命傷を負った…。"); this.fleeBattle(); } },
    load() { const saved = localStorage.getItem(SAVE_KEY); if (saved) { try { const parsed = JSON.parse(saved); state = Object.assign({}, JSON.parse(JSON.stringify(DEFAULT_STATE)), parsed); state.boss.parts = Object.assign({}, DEFAULT_STATE.boss.parts, parsed.boss?.parts); state.lineage.upgrades = Object.assign({}, DEFAULT_STATE.lineage.upgrades, parsed.lineage?.upgrades); } catch(e) { state = JSON.parse(JSON.stringify(DEFAULT_STATE)); this.setupNewHero(); } } else { state = JSON.parse(JSON.stringify(DEFAULT_STATE)); this.setupNewHero(); } },
    save() { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); },
    resetGame() { if(confirm("全世代の記憶を消去し、最初からやり直しますか？")) { localStorage.removeItem(SAVE_KEY); location.reload(); } },
    formatNum(num) { return Math.floor(num).toLocaleString('en-US'); },
    log(type, message) { const logsDiv = document.getElementById('logs'); const entry = document.createElement('div'); entry.className = 'log-entry'; let typeColor = '#888'; if(type === '戦闘') typeColor = '#f55'; if(type === '決戦') typeColor = '#f22'; if(type === 'システム') typeColor = '#eda'; entry.innerHTML = `<span class="log-turn" style="color:${typeColor}">[${type}]</span> ${message}`; logsDiv.prepend(entry); },
    setupNewHero() { const u = state.lineage.upgrades; state.hero.maxLife = 50 + (u.lifeExtender.level * 5); state.hero.life = state.hero.maxLife; const baseMult = Math.pow(1.5, u.baseStats.level); const baseSt = Math.floor(5 * baseMult); state.hero.stats = { str: baseSt, vit: baseSt, agi: baseSt }; state.hero.maxHp = baseSt * 20; state.hero.hp = state.hero.maxHp; state.hero.isBattling = false; this.save(); },
    nextGeneration() { state.lineage.generation++; this.setupNewHero(); document.getElementById('death-overlay').style.display = 'none'; document.getElementById('logs').innerHTML = ''; this.log("システム", `<span class="log-system">第 ${state.lineage.generation} 代 勇者が誕生した。遺志を継ぎ、巨獣を討て。</span>`); this.updateUI(); },
    consumeLife() { state.hero.life--; if (state.hero.life <= 0) { this.log("システム", `<span style="color:#f55; font-weight:bold;">寿命が尽きようとしている…！ 勇者は最後の力を振り絞り、巨獣へ特攻した！</span>`); this.startBossBattle(); } else { this.updateUI(); this.save(); } },
    train() { if(state.hero.isBattling) return; const u = state.lineage.upgrades.trainingFacility; const mult = Math.pow(1.7, u.level - 1); const strGain = Math.floor((Math.random() * 5 + 3) * mult); const vitGain = Math.floor((Math.random() * 5 + 3) * mult); state.hero.stats.str += strGain; state.hero.stats.vit += vitGain; state.hero.maxHp += vitGain * 10; state.hero.hp = state.hero.maxHp; this.log("行動", `過酷な修練を行った！ STR +${this.formatNum(strGain)}, VIT +${this.formatNum(vitGain)}`); this.consumeLife(); },
    explore() { if(state.hero.isBattling) return; const u = state.lineage.upgrades.explorationGear; const mult = Math.pow(1.8, u.level - 1); const lpGain = Math.floor((Math.random() * 10 + 5) * mult); state.lineage.legacyPoints += lpGain; this.log("行動", `危険な領域を探索し、次代への遺産(LP)を ${this.formatNum(lpGain)} 獲得した。`); this.consumeLife(); },
    openBase() { if(state.hero.isBattling) return; document.getElementById('base-modal').style.display = 'flex'; this.updateBaseUI(); },
    closeBase() { document.getElementById('base-modal').style.display = 'none'; },
    updateBaseUI() { document.getElementById('modal-lp').innerText = this.formatNum(state.lineage.legacyPoints); const container = document.getElementById('upgrades-container'); container.innerHTML = ''; for(const key in state.lineage.upgrades) { const upg = state.lineage.upgrades[key]; const cost = Math.floor(upg.baseCost * Math.pow(upg.costMult, upg.level)); const canBuy = state.lineage.legacyPoints >= cost; container.innerHTML += `<div class="upgrade-item"><div style="flex:1;"><div style="font-weight:bold; color:#eda; font-size:1.1em; margin-bottom:5px;">${upg.name} <span style="color:#aaa; font-size:0.8em;">(Lv ${upg.level})</span></div><div style="font-size:0.85em; color:#aaa; line-height:1.3;">${upg.desc}</div></div><div style="margin-left:15px;"><button onclick="game.buyUpgrade('${key}')" ${!canBuy ? 'disabled' : ''} style="padding:10px 15px; background:${canBuy ? '#353' : '#333'}; border-color:${canBuy ? '#5a5' : '#555'};">強化<br><span style="font-size:0.8em;">${this.formatNum(cost)} LP</span></button></div></div>`; } },
    buyUpgrade(key) { const upg = state.lineage.upgrades[key]; const cost = Math.floor(upg.baseCost * Math.pow(upg.costMult, upg.level)); if (state.lineage.legacyPoints >= cost) { state.lineage.legacyPoints -= cost; upg.level++; this.updateBaseUI(); this.updateUI(); this.save(); } },
    startBossBattle() { state.hero.isBattling = true; state.hero.life = 0; this.log("決戦", `<span style="color:#f22; font-size:1.2em; font-weight:bold;">巨獣の咆哮が響き渡る！ 絶望の戦いが始まった！</span>`); this.updateUI(); this.save(); },
    attackBoss(targetId) {
        const h = state.hero; const b = state.boss; const part = b.parts[targetId];
        let damage = Math.floor(h.stats.str * (1 + Math.random() * 0.2));
        if (targetId === 'core' && !b.parts.shell.broken) { damage = Math.floor(damage / 100) || 1; this.log("戦闘", `【外殻】が硬すぎる！本体へのダメージが激減！`); }
        if (targetId === 'core') { b.currentHp = Math.max(0, b.currentHp - damage); b.parts.core.currentHp = b.currentHp; this.log("戦闘", `巨獣の本体に <span class="log-damage">${this.formatNum(damage)}</span> のダメージを与えた！`); }
        else { part.currentHp = Math.max(0, part.currentHp - damage); this.log("戦闘", `${part.name} に <span class="log-damage">${this.formatNum(damage)}</span> のダメージ！`); if (part.currentHp === 0 && !part.broken) { part.broken = true; this.log("システム", `<span style="color:#fd4; font-size:1.1em; font-weight:bold;">【部位破壊】${part.name} を完全に破壊した！！</span>`); } }
        if (b.currentHp === 0) { this.gameClear(); return; }
        let bossBaseDamage = b.parts.rightArm.broken ? 8000 : 250000;
        let atkName = b.parts.rightArm.broken ? "弱々しい叩きつけ" : "天を裂く薙ぎ払い";
        let bossDamage = Math.floor(bossBaseDamage * (0.8 + Math.random() * 0.4));
        let finalBossDamage = Math.max(1, bossDamage - (h.stats.vit * 5));
        h.hp -= finalBossDamage;
        this.log("戦闘", `巨獣の反撃『${atkName}』！ 勇者は <span class="log-damage">${this.formatNum(finalBossDamage)}</span> のダメージを受けた。`);
        if (h.hp <= 0) this.heroDeath(); else { this.updateUI(); this.save(); }
    },
    fleeBattle() { this.log("戦闘", "巨獣の圧倒的恐怖の前に戦意を喪失し、勇者は命を散らした..."); state.hero.hp = 0; this.heroDeath(); },
    heroDeath() { const h = state.hero; const lpReward = Math.floor(h.stats.str / 5 + h.stats.vit / 5 + 10); state.lineage.legacyPoints += lpReward; document.getElementById('death-desc').innerHTML = `第 ${state.lineage.generation} 代勇者は、歴史の礎となった...<br><br>その戦いの記憶と肉体は、一族の<span style="color:#eda;">遺産(LP)</span>へと変換される。<br><span style="font-size:1.3em; color:#eda; font-weight:bold;">獲得LP: +${this.formatNum(lpReward)}</span>`; document.getElementById('death-overlay').style.display = 'flex'; this.save(); },
    gameClear() { markGame2Cleared(); this.updateUI(); document.getElementById('clear-desc').innerHTML = `幾星霜の犠牲の果てに、ついに災厄の巨獣は崩れ落ちた。<br><br><span style="font-size:1.5em; color:#fd4;">クリア世代数：第 ${state.lineage.generation} 代</span><br><br>一族の長き戦いは、ここに完結した。`; document.getElementById('clear-overlay').style.display = 'flex'; this.save(); },
    updateUI() {
        const h = state.hero; const b = state.boss;
        document.getElementById('boss-hp-bar').style.width = `${Math.max(0, (b.currentHp / b.maxHp) * 100)}%`;
        document.getElementById('boss-hp-text').innerText = `災厄の巨獣 HP: ${this.formatNum(b.currentHp)} / ${this.formatNum(b.maxHp)}`;
        const partsDiv = document.getElementById('parts-container'); partsDiv.innerHTML = '';
        ['shell', 'rightArm', 'core'].forEach(key => { const part = b.parts[key]; const pct = Math.max(0, (part.currentHp / part.maxHp) * 100); let status = part.broken ? '<span style="color:#f55; margin-left:5px;">[破壊済]</span>' : ''; if (key === 'core') status = ''; let barHtml = key !== 'core' ? `<div class="part-hp-bar"><div class="part-hp-fill" style="width:${pct}%; background:${part.broken ? '#555' : 'var(--part-hp)'}"></div></div>` : ''; partsDiv.innerHTML += `<div class="part-box" style="background-color: ${part.broken ? '#333' : '#222'}; opacity: ${part.broken ? 0.6 : 1}"><div class="part-name">${part.name} ${status}</div><div class="part-desc">${part.effectDesc}</div>${barHtml}</div>`; });
        const lifeClass = h.life <= 5 && !h.isBattling ? 'life-warning' : '';
        document.getElementById('hero-info').innerHTML = `<h2 class="hero-title">第 ${state.lineage.generation} 代 勇者</h2><div style="margin-bottom:10px;">残り寿命: <span class="life-text ${lifeClass}">${h.life}</span> / ${h.maxLife} ターン</div><div style="margin-bottom:5px;">HP: ${this.formatNum(h.hp)} / ${this.formatNum(h.maxHp)}</div><div class="hero-stats"><div>STR (筋力): ${this.formatNum(h.stats.str)}</div><div>VIT (耐久): ${this.formatNum(h.stats.vit)}</div></div><div style="margin-top:20px; text-align:right; color:#eda; font-weight:bold;">所持LP: ${this.formatNum(state.lineage.legacyPoints)}</div>`;
        if(h.isBattling) { document.getElementById('action-panel').style.display = 'none'; document.getElementById('battle-panel').style.display = 'grid'; document.getElementById('btn-atk-shell').disabled = b.parts.shell.broken; document.getElementById('btn-atk-arm').disabled = b.parts.rightArm.broken; }
        else { document.getElementById('action-panel').style.display = 'grid'; document.getElementById('battle-panel').style.display = 'none'; }
    }
};
window.onload = () => { game.init(); };
</script>
<style>
    .summon-panel { background: #201a2e; border: 1px solid #75a; padding: 15px; margin-top: 15px; border-radius: 8px; text-align: center; }
    .btn-summon { background-color: #528; border-color: #94f; color: #fff; width: 100%; margin-top: 8px; }
    .btn-summon:hover:not(:disabled) { background-color: #639; }
</style>
<script>
(function() {
    const HERO_TRAITS = [
        { name: "狂戦士の血", desc: "STRの伸びが抜群だが、VITが育ちにくく寿命も短い", strMult: 2.2, vitMult: 0.6, lifeBonus: -15 },
        { name: "鋼鉄の肉体", desc: "VITと初期HPが大幅に強化され、寿命も長い", strMult: 0.8, vitMult: 1.8, lifeBonus: 20 },
        { name: "天才の閃き", desc: "修練・探索の効果が1.5倍になるが、やや短命", strMult: 1.5, vitMult: 1.4, lifeBonus: -10 },
        { name: "大器晩成", desc: "初期ステータスは低いが、修練ごとの成長が爆発的", strMult: 2.5, vitMult: 2.0, lifeBonus: -20 },
        { name: "歴戦の凡人", desc: "特筆すべき偏りはないが、心身ともに安定している", strMult: 1.1, vitMult: 1.1, lifeBonus: 5 }
    ];
    const originalSetupNewHero = game.setupNewHero;
    game.setupNewHero = function() {
        originalSetupNewHero.apply(this, arguments);
        const trait = HERO_TRAITS[Math.floor(Math.random() * HERO_TRAITS.length)];
        state.hero.trait = trait; state.hero.maxLife = Math.max(10, (50 + (state.lineage.upgrades.lifeExtender.level * 5)) + trait.lifeBonus); state.hero.life = state.hero.maxLife;
        state.hero.stats.str = Math.floor(state.hero.stats.str * (trait.strMult > 1 ? trait.strMult : 1)); state.hero.stats.vit = Math.floor(state.hero.stats.vit * trait.vitMult);
        state.hero.maxHp = Math.floor(state.hero.stats.vit * 20 * trait.vitMult); state.hero.hp = state.hero.maxHp;
        this.log("血脈", `<span style="color:#fd4;">【血脈発現】${trait.name}：${trait.desc}</span>`);
    };
    function getAvailableHeroes() {
        let heroes = [{ id: "arthur", name: "“剣聖” アーサー", desc: "異世界より現れた剣の達人。巨獣の本体に手堅いダメージを与える", cost: 150, power: 15000000 }];
        if (state.lineage.generation >= 3 || state.lineage.legacyPoints >= 300) { heroes.push({ id: "sageGrandson", name: "??? (賢者のまご)", desc: "理外の力により、巨獣の全HP・全部位を文字通り一撃で葬り去る", cost: 1000, power: 500000000 }); }
        return heroes;
    }
    function injectSummonUI() {
        const leftPanel = document.getElementById('left-panel');
        if (leftPanel && !document.getElementById('summon-section')) {
            const summonDiv = document.createElement('div'); summonDiv.id = 'summon-section'; summonDiv.className = 'summon-panel';
            summonDiv.innerHTML = `<div style="font-weight:bold; color:#d8f; font-size:1.05em; margin-bottom:5px;">✨ 異世界召喚の陣</div><div style="font-size:0.8em; color:#aaa; margin-bottom:10px;">遺産(LP)を消費し、異世界の英雄を現界させる</div><div id="summon-buttons-container"></div>`;
            leftPanel.insertBefore(summonDiv, document.getElementById('action-panel'));
        }
        updateSummonButtons();
    }
    function updateSummonButtons() {
        const container = document.getElementById('summon-buttons-container'); if (!container) return; container.innerHTML = '';
        getAvailableHeroes().forEach((hero) => { const canAfford = state.lineage.legacyPoints >= hero.cost; container.innerHTML += `<div style="margin-bottom:8px; text-align:left; background:#181222; padding:8px; border-radius:6px; border:1px solid #436;"><div style="font-weight:bold; color:${hero.id === 'sageGrandson' ? '#ff77ff' : '#ecf'}; font-size:0.9em;">${hero.name}</div><div style="font-size:0.75em; color:#bbb; margin:3px 0;">${hero.desc}</div><button class="btn-summon" onclick="summonHeroById('${hero.id}')" ${!canAfford ? 'disabled' : ''} style="padding:8px; font-size:0.9em;">召喚する (${hero.cost} LP)</button></div>`; });
    }
    window.summonHeroById = function(id) {
        const hero = getAvailableHeroes().find(h => h.id === id); if (!hero || state.lineage.legacyPoints < hero.cost) return;
        state.lineage.legacyPoints -= hero.cost;
        if (id === 'arthur') { state.boss.currentHp = Math.max(0, state.boss.currentHp - hero.power); state.boss.parts.core.currentHp = state.boss.currentHp; game.log("異世界召喚", `<span style='color:#d8f; font-weight:bold;'>【異世界召喚】${hero.name} が現れ、聖剣の一閃で巨獣に <span class="log-damage">${game.formatNum(hero.power)}</span> の大ダメージを与えた！</span>`); }
        else if (id === 'sageGrandson') { state.boss.parts.shell.currentHp = 0; state.boss.parts.shell.broken = true; state.boss.parts.rightArm.currentHp = 0; state.boss.parts.rightArm.broken = true; state.boss.currentHp = 0; state.boss.parts.core.currentHp = 0; game.log("異世界召喚", `<span style='color:#ff55ff; font-weight:bold;'>⚡【隠し降臨】「賢者のまご」が空間を引き裂き顕現！ 理外の一撃により、災厄の巨獣は跡形もなく消し飛んだ！！</span>`); }
        if (state.boss.currentHp === 0) game.gameClear(); else { game.updateUI(); game.save(); }
    };
    function injectDailyLifeUI() {
        const actionPanel = document.getElementById('action-panel');
        if (actionPanel && !document.getElementById('btn-daily-life')) {
            const btn = document.createElement('button'); btn.id = 'btn-daily-life';
            btn.innerHTML = '普通の暮らしを送る<br><span style="font-size:0.8em; font-weight:normal;">(戦いを放棄し平和に生きる)</span>';
            btn.style.gridColumn = 'span 2'; btn.style.background = '#254a4a'; btn.style.borderColor = '#489';
            btn.onclick = triggerDailyLifeEnding; actionPanel.appendChild(btn);
        }
    }
    window.triggerDailyLifeEnding = function() {
        if (state.hero.isBattling) return;
        if (confirm("巨獣との戦いを諦め、この世界で普通の暮らし（日常）を送りますか？\n（※戦いのない平和な結末を迎えます）")) {
            state.hero.life = 0; state.hero.isBattling = false; game.save(); markGame2Cleared();
            const clearOverlay = document.getElementById('clear-overlay');
            if (clearOverlay) {
                clearOverlay.style.display = 'flex';
                document.getElementById('clear-desc').innerHTML = `勇者は武器を置き、巨獣の脅威から離れた穏やかな土地で家族を築き、普通の暮らしを選んだ。<br><br><span style="font-size:1.4em; color:#6ef;">【日常エンド：普通の暮らし】</span>`;
            }
            game.log("システム", "<span style='color:#6ef; font-weight:bold;'>【日常エンド】勇者は戦いを経ず、穏やかな日常の生活を全うした……。</span>");
        }
    };
    const originalUpdateUI = game.updateUI;
    game.updateUI = function() { originalUpdateUI.apply(this, arguments); injectSummonUI(); injectDailyLifeUI(); };
    window.addEventListener('DOMContentLoaded', () => { setTimeout(() => { injectSummonUI(); injectDailyLifeUI(); }, 150); });
    if (window.game) { injectSummonUI(); injectDailyLifeUI(); }
})();
</script>

<script src="assets/spacecat.js"></script>
<script>
(function() {

    'HP5億の巨獣とか正気じゃないにゃ…！ 何代かけても倒すにゃ！',
    [
      { text: 'まずは修練と探索でLPを貯めるにゃ！', mood: 'normal' },
      { text: '実は「戦わない」という選択肢もあるらしいにゃ…？', mood: 'smile' },
      { text: '3代目以降か300LP以上でヤバい召喚が解放されるかもにゃ！', mood: 'angry' }

    cat.say('また勇者が散ったにゃ…！ 遺産(LP)を次に託すにゃ！', 'angry');

  const origClear = game.gameClear;

  const origDaily = window.triggerDailyLifeEnding;

  };
})();
</script>
