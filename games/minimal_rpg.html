<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- AI-GAME-PORTFOLIO -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ミニマム文字RPG：ストーリー討伐</title>
  <style>
    body { font-family: 'Courier New', Courier, monospace; background-color: #0d0d0d; color: #00ff66; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
    .game-container { width: 100%; max-width: 600px; background: #141414; border: 2px solid #00ff66; border-radius: 6px; padding: 25px; box-shadow: 0 0 20px rgba(0,255,102,0.2); }
    h1 { margin-top: 0; font-size: 1.5em; text-align: center; border-bottom: 1px dashed #00ff66; padding-bottom: 10px; color: #fff; }
    .screen { display: none; }
    .screen.active { display: block; }
    textarea { width: 100%; height: 120px; background: #000; color: #00ff66; border: 1px solid #00ff66; padding: 10px; font-family: monospace; font-size: 1em; resize: none; box-sizing: border-box; margin-bottom: 15px; }
    button { background: #00ff66; color: #000; border: none; padding: 12px 20px; font-weight: bold; cursor: pointer; font-family: monospace; font-size: 1em; width: 100%; }
    button:hover { background: #00cc52; }
    .status-bar { display: flex; justify-content: space-between; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; font-size: 0.9em; color: #aaa; }
    .status-bar span { color: #00ff66; font-weight: bold; }
    .story-box { background: #1a1a1a; border: 1px dashed #444; padding: 15px; margin-bottom: 20px; min-height: 80px; max-height: 120px; overflow-y: auto; line-height: 1.6; color: #ddd; word-break: break-all; }
    .enemy-box { background: #2a0a0a; border: 1px solid #ff3333; color: #ff6666; padding: 15px; text-align: center; margin-bottom: 20px; font-size: 1.2em; font-weight: bold; word-break: break-all; }
    .log-box { background: #000; border: 1px solid #333; padding: 10px; height: 100px; overflow-y: auto; font-size: 0.85em; color: #888; margin-bottom: 15px; }
    .btn-group { display: flex; gap: 10px; }
  </style>
</head>
<body>
  <div class="game-container">
    <h1>MINIMAL TEXT RPG</h1>

    <!-- ステージ1：ストーリー入力 -->
    <div id="screen-input" class="screen active">
      <p>ここに好きなストーリー（小説、日記、テキスト）を入力してください。<br>その文章があなたの「敵」になり、最後まで倒すとゲームクリアです。</p>
      <textarea id="story-input" placeholder="例：むかしむかし、あるところに、おじいさんとおばあさんがいました。おじいさんは山へ芝刈りに、おばあさんは川へ洗濯に行きました。そこへ突如として魔王が現れ、世界は闇に包まれた……"></textarea>
      <button id="start-btn">冒険をはじめる</button>
    </div>

    <!-- ステージ2：バトル＆進行 -->
    <div id="screen-battle" class="screen">
      <div class="status-bar">
        <div>Lv: <span id="stat-lv">1</span></div>
        <div>EXP: <span id="stat-exp">0</span> / <span id="stat-next">10</span></div>
        <div>進捗: <span id="stat-progress">0</span>%</div>
      </div>

      <div style="font-size: 0.8em; color: #888; margin-bottom: 5px;">【いま読んでいる（戦っている）ストーリー】</div>
      <div id="current-story" class="story-box"></div>

      <div style="font-size: 0.8em; color: #888; margin-bottom: 5px;">【現在の文字の敵】</div>
      <div id="enemy-text" class="enemy-box"></div>

      <div id="battle-log" class="log-box"></div>

      <div class="btn-group">
        <button id="attack-btn">攻撃する (文字を削る)</button>
      </div>
    </div>

    <!-- ステージ3：クリア画面 -->
    <div id="screen-clear" class="screen" style="text-align: center;">
      <h2 style="color: #00ff66;">🎉 物語クリア！</h2>
      <p>すべてのストーリーの文字を討伐し、物語を完走しました！</p>
      <button id="reset-btn">もう一度別のストーリーで遊ぶ</button>
    </div>
  </div>

  <script>
    let rawStory = "";
    let chunks = [];
    let currentIndex = 0;
    let lv = 1;
    let exp = 0;
    let nextExp = 10;
    let currentEnemy = "";
    let enemyHp = 0;
    let enemyMaxHp = 0;

    function startGame() {
      const inputEl = document.getElementById("story-input");
      const text = inputEl ? inputEl.value.trim() : "";
      
      if (!text) {
        alert("ストーリーを入力してください！");
        return;
      }
      
      rawStory = text;
      chunks = [];
      // 2文字ずつ分割して敵にする
      for (let i = 0; i < text.length; i += 2) {
        chunks.push(text.substr(i, 2));
      }
      
      currentIndex = 0;
      lv = 1;
      exp = 0;
      nextExp = 10;
      
      document.getElementById("screen-input").classList.remove("active");
      document.getElementById("screen-battle").classList.add("active");
      document.getElementById("battle-log").innerHTML = "";
      
      loadNextEnemy();
      updateStatus();
    }

    function loadNextEnemy() {
      if (currentIndex >= chunks.length) {
        document.getElementById("screen-battle").classList.remove("active");
        document.getElementById("screen-clear").classList.add("active");
        return;
      }
      currentEnemy = chunks[currentIndex];
      enemyMaxHp = currentEnemy.length * 5;
      enemyHp = enemyMaxHp;
      
      let readText = chunks.slice(0, currentIndex).join("");
      document.getElementById("current-story").innerText = readText || "(まだ物語の始まり)";
      document.getElementById("enemy-text").innerText = `「${currentEnemy}」 (HP: ${enemyHp}/${enemyMaxHp})`;
      
      logMessage(`新たな文字の敵「${currentEnemy}」が現れた！`);
      updateStatus();
    }

    function attackEnemy() {
      let damage = lv * 2;
      enemyHp -= damage;
      if (enemyHp < 0) enemyHp = 0;

      logMessage(`あなたの攻撃！ ${currentEnemy} に ${damage} のダメージ！（残りHP: ${enemyHp}）`);
      document.getElementById("enemy-text").innerText = `「${currentEnemy}」 (HP: ${enemyHp}/${enemyMaxHp})`;

      if (enemyHp <= 0) {
        let gainedExp = currentEnemy.length * 5;
        exp += gainedExp;
        logMessage(`▶ 「${currentEnemy}」を撃破！ EXP +${gainedExp}`);
        
        if (exp >= nextExp) {
          lv++;
          exp -= nextExp;
          nextExp = Math.floor(nextExp * 1.5);
          logMessage(`✨ レベルが上がった！ 現在 Lv.${lv}`);
        }

        currentIndex++;
        loadNextEnemy();
      }
      updateStatus();
    }

    function updateStatus() {
      document.getElementById("stat-lv").innerText = lv;
      document.getElementById("stat-exp").innerText = exp;
      document.getElementById("stat-next").innerText = nextExp;
      
      let progress = Math.floor((currentIndex / chunks.length) * 100);
      document.getElementById("stat-progress").innerText = progress;
    }

    function logMessage(msg) {
      const logBox = document.getElementById("battle-log");
      if (logBox) {
        logBox.innerHTML += `<div>> ${msg}</div>`;
        logBox.scrollTop = logBox.scrollHeight;
      }
    }

    function resetGame() {
      document.getElementById("screen-clear").classList.remove("active");
      document.getElementById("screen-input").classList.add("active");
      const inputEl = document.getElementById("story-input");
      if (inputEl) inputEl.value = "";
    }

    // ボタンのイベントリスナー（確実に反応するように設定）
    window.addEventListener("DOMContentLoaded", () => {
      const startBtn = document.getElementById("start-btn");
      if (startBtn) startBtn.addEventListener("click", startGame);

      const attackBtn = document.getElementById("attack-btn");
      if (attackBtn) attackBtn.addEventListener("click", attackEnemy);

      const resetBtn = document.getElementById("reset-btn");
      if (resetBtn) resetBtn.addEventListener("click", resetGame);
    });
  </script>
</body>
</html>
