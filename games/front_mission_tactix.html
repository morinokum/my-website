    <!-- AUDIO & SFX ENGINE (Synthesized with Web Audio API) -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSfx(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(400, now + 0.05);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
                osc.start(now);
                osc.stop(now + 0.05);
            } else if (type === 'shoot') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'explosion') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(90, now);
                osc.frequency.exponentialRampToValueAtTime(20, now + 0.4);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'hit') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            }
        }
    </script>

                            ${filteredParts.length === 0 ? '<div class="text-center text-gray-500 py-6 text-sm">NO SPARE PARTS IN INVENTORY. VISIT SHOP.</div>' : ''}
                            ${filteredParts.map((p, idx) => `
                                <div class="bg-gray-950 border border-gray-800 p-3 rounded flex justify-between items-center hover:border-blue-500 transition">
                                    <div>
                                        <div class="font-bold text-sm text-white">${p.name}</div>
                                        <div class="text-xs text-gray-400 mt-1">WEIGHT: ${p.weight}T | HP: ${p.hp || 100} ${p.atk ? '| ATK: ' + p.atk : ''} ${p.move ? '| MOVE: ' + p.move : ''}</div>
                                    </div>
                                    <button onclick="equipPart(${idx})" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white font-orbitron text-xs rounded transition">EQUIP</button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHTML);
        }

        function equipPart(invIdx) {
            const slot = currentSwapSlot;
            const wap = gameState.waps[selectedWapIdx];
            const part = gameState.inventory.parts[invIdx];
            
            // Remove from inventory and assign to WAP
            gameState.inventory.parts.splice(invIdx, 1);
            
            // Put old part back to inventory
            const oldPart = wap[slot];
            gameState.inventory.parts.push({
                id: "old_" + Math.random(),
                type: slot,
                name: oldPart.name,
                hp: oldPart.maxHp,
                maxHp: oldPart.maxHp,
                def: oldPart.def,
                atk: oldPart.atk,
                hit: oldPart.hit,
                ammo: oldPart.ammo,
                maxAmmo: oldPart.maxAmmo,
                move: oldPart.move,
                evade: oldPart.evade,
                weight: oldPart.weight,
                output: oldPart.output,
                defBoost: oldPart.defBoost
            });

            // Set new part
            wap[slot] = {
                name: part.name,
                hp: part.hp || 150,
                maxHp: part.hp || 150,
                def: part.def || 20,
                atk: part.atk || 0,
                hit: part.hit || 80,
                ammo: part.ammo || 10,
                maxAmmo: part.maxAmmo || 10,
                weight: part.weight || 20,
                output: part.output || 0,
                move: part.move || 5,
                evade: part.evade || 20,
                defBoost: part.defBoost || 0
            };

            document.getElementById('swap-modal').remove();
            playSfx('click');
            showHangarScreen();
        }

        // --- SHOP SCREEN ---
        function showShopScreen() {
            const container = document.getElementById("app-container");
            const shopItems = [
                { type: "body", name: "Heavy Vanguard Body", hp: 350, def: 50, weight: 80, output: 140, price: 12000 },
                { type: "rArm", name: "Heavy Bazooka Arm", hp: 120, atk: 85, hit: 65, ammo: 4, maxAmmo: 4, weight: 40, price: 9500 },
                { type: "lArm", name: "Plasma Torch Arm", hp: 130, atk: 70, hit: 85, weight: 30, price: 8500 },
                { type: "legs", name: "All-Terrain Quad Legs", hp: 220, move: 4, evade: 15, weight: 50, price: 7500 }
            ];

            container.innerHTML = `
                <div class="w-full flex flex-col space-y-4">
                    <div class="flex justify-between items-center border-b border-gray-800 pb-3">
                        <div class="flex items-center space-x-4">
                            <button onclick="playSfx('click'); showTitleScreen();" class="px-3 py-1 bg-gray-800 hover:bg-gray-700 text-xs font-orbitron rounded border border-gray-600">&lt; MAIN MENU</button>
                            <h2 class="font-orbitron font-bold text-2xl text-emerald-400">BLACK MARKET PARTS SHOP</h2>
                        </div>
                        <div class="font-orbitron text-sm text-emerald-400">CREDITS: ${gameState.credits.toLocaleString()} ¢</div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${shopItems.map((item, idx) => `
                            <div class="bg-gray-900 border border-gray-800 p-4 rounded-lg flex justify-between items-center">
                                <div>
                                    <span class="text-xs font-orbitron px-2 py-0.5 bg-blue-950 text-blue-400 rounded border border-blue-800">${item.type.toUpperCase()}</span>
                                    <div class="font-bold text-white text-base mt-1">${item.name}</div>
                                    <div class="text-xs text-gray-400 mt-1">WEIGHT: ${item.weight}T | PRICE: <span class="text-emerald-400 font-bold">${item.price.toLocaleString()} ¢</span></div>
                                </div>
                                <button onclick="buyPart(${idx})" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-orbitron text-xs rounded transition shadow">PURCHASE</button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function buyPart(idx) {
            const shopItems = [
                { type: "body", name: "Heavy Vanguard Body", hp: 350, maxHp: 350, def: 50, weight: 80, output: 140, price: 12000 },
                { type: "rArm", name: "Heavy Bazooka Arm", hp: 120, maxHp: 120, atk: 85, hit: 65, ammo: 4, maxAmmo: 4, weight: 40, price: 9500 },
                { type: "lArm", name: "Plasma Torch Arm", hp: 130, maxHp: 130, atk: 70, hit: 85, weight: 30, price: 8500 },
                { type: "legs", name: "All-Terrain Quad Legs", hp: 220, maxHp: 220, move: 4, evade: 15, weight: 50, price: 7500 }
            ];
            const item = shopItems[idx];
            if (gameState.credits >= item.price) {
                gameState.credits -= item.price;
                gameState.inventory.parts.push(item);
                playSfx('click');
                alertBox("PARTS ACQUIRED", `${item.name} has been added to your inventory.`);
                showShopScreen();
                updateHeaderUI();
            } else {
                alertBox("INSUFFICIENT CREDITS", "You do not have enough credits for this purchase.");
            }
        }

        function alertBox(title, msg) {
            const modal = document.createElement('div');
            modal.innerHTML = `
                <div class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
                    <div class="bg-gray-900 border border-blue-500/50 rounded-lg p-6 max-w-sm w-full text-center space-y-4">
                        <div class="font-orbitron font-bold text-blue-400">${title}</div>
                        <div class="text-xs text-gray-300">${msg}</div>
                        <button onclick="this.closest('.fixed').remove()" class="px-4 py-2 bg-blue-600 text-white font-orbitron text-xs rounded">OK</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        }

        // --- ARENA SCREEN ---
        function showArenaScreen() {
            const container = document.getElementById("app-container");
            container.innerHTML = `
                <div class="w-full flex flex-col space-y-4 max-w-2xl mx-auto">
                    <div class="flex justify-between items-center border-b border-gray-800 pb-3">
                        <button onclick="playSfx('click'); showTitleScreen();" class="px-3 py-1 bg-gray-800 hover:bg-gray-700 text-xs font-orbitron rounded border border-gray-600">&lt; MAIN MENU</button>
                        <h2 class="font-orbitron font-bold text-2xl text-amber-400">ARENA SURVIVAL MATCH</h2>
                    </div>
                    <div class="bg-gray-900 border border-amber-500/30 p-6 rounded-lg text-center space-y-4">
                        <div class="text-sm font-orbitron text-gray-300">CURRENT ARENA RANK: <span class="text-amber-400 font-bold">RANK #${gameState.arenaRank}</span></div>
                        <p class="text-xs text-gray-400 leading-relaxed">アリーナでランダムエンカウンターの敵WAPと交戦せよ。勝利することで賞金と実戦経験を獲得できる。</p>
                        <button onclick="startBattle('arena')" class="px-6 py-3 bg-amber-600 hover:bg-amber-500 text-white font-orbitron font-bold text-sm rounded shadow-lg transition">ENTER ARENA COMBAT</button>
                    </div>
                </div>
            `;
        }

        function showMissionSelect() {
            startBattle('campaign');
        }

        // --- TACTICAL BATTLE ENGINE ---
        let battleState = null;

        function startBattle(mode) {
            playSfx('click');
            // Initialize battle grid & units
            const playerWap = JSON.parse(JSON.stringify(gameState.waps[0])); // Player lead Wap
            const enemyWap = {
                name: mode === 'arena' ? "CHALLENGER-X" : `ZONIAN-PATROL #${gameState.campaignStage}`,
                color: "#ef4444",
                body: { name: "Z-Body", hp: 180, maxHp: 180, def: 20 },
                rArm: { name: "Enemy MG", hp: 120, maxHp: 120, atk: 30, hit: 80, ammo: 10, maxAmmo: 10 },
                lArm: { name: "Enemy Shield", hp: 130, maxHp: 130, defBoost: 20 },
                legs: { name: "Enemy Legs", hp: 150, maxHp: 150, move: 5, evade: 15 },
                x: 7, y: 3
            };
            playerWap.x = 2;
            playerWap.y = 3;

            battleState = {
                mode: mode,
                turn: 'player', // 'player' or 'enemy'
                player: playerWap,
                enemy: enemyWap,
                selectedAction: null, // 'move', 'rArm', 'lArm', 'wait'
                logs: ["バトル開始。敵WAPを撃破せよ。"]
            };

            renderBattleScreen();
        }

        function renderBattleScreen() {
            const container = document.getElementById("app-container");
            const p = battleState.player;
            const e = battleState.enemy;

            container.innerHTML = `
                <div class="w-full flex flex-col space-y-3 max-w-5xl mx-auto">
                    <!-- Battle Header -->
                    <div class="flex justify-between items-center bg-gray-900 border border-blue-500/30 p-3 rounded-lg">
                        <div class="font-orbitron font-bold text-sm text-blue-400">TACTICAL COMBAT // ${battleState.mode.toUpperCase()}</div>
                        <div class="font-orbitron text-xs text-amber-400">TURN: ${battleState.turn.toUpperCase()}</div>
                        <button onclick="showTitleScreen()" class="px-3 py-1 bg-red-950 hover:bg-red-900 text-red-300 text-xs font-orbitron rounded border border-red-800">ABORT</button>
                    </div>

                    <!-- Battle Arena Visual Canvas & Status Grid -->
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
                        <!-- Player Status Card -->
                        <div class="bg-gray-900 border border-blue-500/40 p-4 rounded-lg space-y-2">
                            <div class="flex justify-between font-orbitron text-xs text-blue-400 font-bold">
                                <span>[PLAYER] ${p.name}</span>
                                <span>HP: ${p.body.hp + p.rArm.hp + p.lArm.hp + p.legs.hp}</span>
                            </div>
                            <div class="grid grid-cols-2 gap-2 text-[11px] font-orbitron">
                                <div class="bg-gray-950 p-2 rounded">BODY: ${p.body.hp}/${p.body.maxHp}</div>
                                <div class="bg-gray-950 p-2 rounded">R-ARM: ${p.rArm.hp}/${p.rArm.maxHp}</div>
                                <div class="bg-gray-950 p-2 rounded">L-ARM: ${p.lArm.hp}/${p.lArm.maxHp}</div>
                                <div class="bg-gray-950 p-2 rounded">LEGS: ${p.legs.hp}/${p.legs.maxHp}</div>
                            </div>
                        </div>

                        <!-- Canvas Visualizer -->
                        <div class="bg-gray-950 border border-gray-800 rounded-lg flex items-center justify-center relative overflow-hidden h-44">
                            <canvas id="battleCanvas" width="400" height="170" class="w-full h-full"></canvas>
                            <div class="absolute bottom-1 left-2 text-[10px] font-orbitron text-gray-500">GRID POSITION: P(${p.x},${p.y}) vs E(${e.x},${e.y})</div>
                        </div>

                        <!-- Enemy Status Card -->
                        <div class="bg-gray-900 border border-red-500/40 p-4 rounded-lg space-y-2">
                            <div class="flex justify-between font-orbitron text-xs text-red-400 font-bold">
                                <span>[ENEMY] ${e.name}</span>
                                <span>HP: ${e.body.hp + e.rArm.hp + e.lArm.hp + e.legs.hp}</span>
                            </div>
                            <div class="grid grid-cols-2 gap-2 text-[11px] font-orbitron">
                                <div class="bg-gray-950 p-2 rounded">BODY: ${e.body.hp}/${e.body.maxHp}</div>
                                <div class="bg-gray-950 p-2 rounded">R-ARM: ${e.rArm.hp}/${e.rArm.maxHp}</div>
                                <div class="bg-gray-950 p-2 rounded">L-ARM: ${e.lArm.hp}/${e.lArm.maxHp}</div>
                                <div class="bg-gray-950 p-2 rounded">LEGS: ${e.legs.hp}/${e.legs.maxHp}</div>
                            </div>
                        </div>
                    </div>

                    <!-- Action Controls & Combat Log -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <!-- Action Menu -->
                        <div class="bg-gray-900 border border-gray-800 p-4 rounded-lg flex flex-col space-y-2">
                            <div class="font-orbitron text-xs text-gray-400 mb-1">COMMAND DECK</div>
                            <button onclick="playerAttack('rArm')" ${battleState.turn !== 'player' || p.rArm.hp <= 0 ? 'disabled' : ''} class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 disabled:bg-gray-800 disabled:text-gray-600 text-white font-orbitron text-xs rounded transition">
                                FIRE R-ARM (${p.rArm.name})
                            </button>
                            <button onclick="playerAttack('lArm')" ${battleState.turn !== 'player' || p.lArm.hp <= 0 ? 'disabled' : ''} class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 disabled:bg-gray-800 disabled:text-gray-600 text-white font-orbitron text-xs rounded transition">
                                USE L-ARM (${p.lArm.name})
                            </button>
                            <button onclick="playerAdvance()" ${battleState.turn !== 'player' || p.legs.hp <= 0 ? 'disabled' : ''} class="w-full py-2.5 bg-gray-800 hover:bg-gray-700 disabled:bg-gray-800 disabled:text-gray-600 text-gray-200 font-orbitron text-xs rounded transition">
                                ADVANCE / REPOSITION
                            </button>
                        </div>

                        <!-- Combat Log Box -->
                        <div class="md:col-span-2 bg-gray-950 border border-gray-800 p-4 rounded-lg font-mono text-xs text-gray-300 h-36 overflow-y-auto flex flex-col space-y-1" id="battle-logs">
                            ${battleState.logs.map(l => `<div>&gt; ${l}</div>`).join('')}
                        </div>
                    </div>
                </div>
            `;
            drawBattleCanvas();
        }

        function drawBattleCanvas() {
            const canvas = document.getElementById('battleCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Grid lines
            ctx.strokeStyle = '#1f2937';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }

            const p = battleState.player;
            const e = battleState.enemy;

            // Draw Player WAP
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x * 40, 60, 30, 45);
            ctx.fillStyle = '#ffffff';
            ctx.font = '10px Orbitron';
            ctx.fillText("P-WAP", p.x * 40, 55);

            // Draw Enemy WAP
            ctx.fillStyle = e.color;
            ctx.fillRect(e.x * 40, 60, 30, 45);
            ctx.fillStyle = '#ffffff';
            ctx.fillText("ENEMY", e.x * 40, 55);
        }

        function addBattleLog(text) {
            battleState.logs.unshift(text);
            if (battleState.logs.length > 10) battleState.logs.pop();
            const logEl = document.getElementById('battle-logs');
            if (logEl) {
                logEl.innerHTML = battleState.logs.map(l => `<div>&gt; ${l}</div>`).join('');
            }
        }

        function playerAttack(armType) {
            if (battleState.turn !== 'player') return;
            const p = battleState.player;
            const e = battleState.enemy;
            const weapon = p[armType];

            playSfx('shoot');
            addBattleLog(`${p.name}が ${weapon.name} で攻撃！`);

            // Target random enemy part (Body, R-Arm, L-Arm, Legs)
            const parts = ['body', 'rArm', 'lArm', 'legs'];
            const targetPartKey = parts[Math.floor(Math.random() * parts.length)];
            const targetPart = e[targetPartKey];

            const hitRoll = Math.random() * 100;
            if (hitRoll <= (weapon.hit || 80)) {
                const dmg = Math.floor((weapon.atk || 40) * (0.8 + Math.random() * 0.4));
                targetPart.hp = Math.max(0, targetPart.hp - dmg);
                playSfx('hit');
                addBattleLog(`-> 命中！ 敵の ${targetPartKey.toUpperCase()} に ${dmg} のダメージ！`);
                if (targetPart.hp === 0) {
                    addBattleLog(`=> 警告！ 敵の ${targetPartKey.toUpperCase()} が破壊された！`);
                }
            } else {
                addBattleLog(`-> 攻撃は回避された！`);
            }

            checkBattleEnd();
            if (battleState && battleState.turn === 'player') {
                battleState.turn = 'enemy';
                setTimeout(enemyTurnAI, 1000);
            }
            renderBattleScreen();
        }

        function playerAdvance() {
            if (battleState.turn !== 'player') return;
            const p = battleState.player;
            if (p.x < 8) p.x += 1;
            addBattleLog(`${p.name} が前進した。距離を詰める。`);
            playSfx('click');
            battleState.turn = 'enemy';
            setTimeout(enemyTurnAI, 1000);
            renderBattleScreen();
        }

        function enemyTurnAI() {
            if (!battleState || battleState.turn !== 'enemy') return;
            const p = battleState.player;
            const e = battleState.enemy;

            playSfx('shoot');
            addBattleLog(`敵 ${e.name} の反撃ターン！`);

            const parts = ['body', 'rArm', 'lArm', 'legs'];
            const targetPartKey = parts[Math.floor(Math.random() * parts.length)];
            const targetPart = p[targetPartKey];

            const dmg = Math.floor(25 * (0.8 + Math.random() * 0.4));
            targetPart.hp = Math.max(0, targetPart.hp - dmg);
            playSfx('hit');
            addBattleLog(`-> 敵の攻撃が自機の ${targetPartKey.toUpperCase()} に命中！ ${dmg} ダメージ！`);

            if (targetPart.hp === 0) {
                addBattleLog(`=> 致命的ダメージ！ 自機の ${targetPartKey.toUpperCase()} が破壊された！`);
            }

            checkBattleEnd();
            if (battleState) {
                battleState.turn = 'player';
            }
            renderBattleScreen();
        }

        function checkBattleEnd() {
            const p = battleState.player;
            const e = battleState.enemy;

            const pTotalHp = p.body.hp + p.rArm.hp + p.lArm.hp + p.legs.hp;
            const eTotalHp = e.body.hp + e.rArm.hp + e.lArm.hp + e.legs.hp;

            if (e.body.hp <= 0 || eTotalHp <= 0) {
                playSfx('explosion');
                addBattleLog(`=> 敵ヴァンツァーを撃破！ 勝利！`);
                setTimeout(() => {
                    const reward = battleState.mode === 'arena' ? 5000 : 8000;
                    gameState.credits += reward;
                    if (battleState.mode === 'campaign') {
                        gameState.campaignStage += 1;
                    }
                    alertBox("VICTORY", `戦闘に勝利しました！ 報酬: ${reward.toLocaleString()} ¢`);
                    showTitleScreen();
                }, 1500);
                battleState = null;
            } else if (p.body.hp <= 0 || pTotalHp <= 0) {
                playSfx('explosion');
                addBattleLog(`=> 自機が撃破されました... 敗北。`);
                setTimeout(() => {
                    alertBox("DEFEAT", "ヴァンツァーが大破しました。ハンガーに戻ります。");
                    showTitleScreen();
                }, 1500);
                battleState = null;
            }
        }

        // Initialize on load
        window.onload = function() {
            showTitleScreen();
        };
    </script>
</body>
</html>
